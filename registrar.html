<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>registrarse</title>
    <link rel="stylesheet" href="css/style-inicio.css">
</head>

<body>
    <div class="contenedor">

        <header>
            <h2>Crea tu cuenta</h2>
            <p>Únete a nuestra comunidad y empueza a jugar</p>
        </header>

        <div class="form">

            <form action="catalogo.html" method="get">


                <div class="inputs">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" placeholder="Nombre de usuuario" required><br>
                    <label for="username">Correo electrónico</label>
                    <input type="email" id="email" name="username" placeholder="Correo electrónico" required><br>
                    <label for="username">Contraseña</label>
                    <input type="password" id="username" name="username" placeholder="Contraseña" required><br>
                    <label for="username">Confirmar contraseña</label>
                    <input type="password" id="username" name="username" placeholder="Confirmar contraseña"
                    required><br><br>
                </div>

                <button type="submit" class="btn-ingresar"><strong>Crear cuenta</strong></button><br><br>
                <p>al registrarte aceptas nuestros <a href="#">términos de servicio</a> y <a href="#">Política de
                        privacidad</a></p> <br>
                <div class="separador">
                    <span></span>
                    <p>O registrate con</p>
                    <span></span>
                </div>

                <div class="login-redes">
                    <button class="redes-btn">
                        <img src="img/google.png" alt="Google">
                    </button>

                    <button class="redes-btn">
                        <img src="img/apple.png" alt="Apple">
                    </button>

                    <button class="redes-btn">
                        <img src="img/x.png" alt="X">
                    </button>
                </div>
                <div class="cuentasi">
                    <p>¿Ya tienes cuenta? <a href="index.html">iniciar sesion</a></p>
                </div>
            </form>
        </div>





    </div>

</body>

</html>
