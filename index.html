<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="css/style-inicio.css">
</head>

<body>
    <div class="contenedor">

        <header>
            <h2>Iniciar sesion</h2>
            <p>Ininicie sesion para seguir explorando</p>
        </header>

        <div class="form">

            <form action="catalogo.html" method="get">

                <div class="inputs">

                    <label for="email">correo electrónico: </label><br>
                    <input type="email" id="email" name="email" placeholder="correo@email.com" required><br>
                    <label for="passwprd">contraseña: </label><br>
                    <input type="password" id="password" name="password" placeholder="********" required><br>

                    <div class="checkbox">
                        <div>

                            <input type="checkbox" id="checkbox" name="checkbox" >

                            <label for="checkbox">recordar usuario </label>
                        </div>

                        <p><a href="#">¿Olvidaste la contraseña?</a></p>
                    </div>

                    

                </div>
                <button type="submit" class="btn-ingresar">ingresar</button><br><br>
                <div class="separador">
                    <span></span>
                    <p>O continúa con</p>
                    <span></span>
                </div>

                <div class="login-redes">
                    <button class="redes-btn">
                        <img src="img/google.png" alt="Google">
                    </button>

                    <button class="redes-btn">
                        <img src="img/apple.png" alt="Apple">
                    </button>

                    <button class="redes-btn">
                        <img src="img/x.png" alt="X">
                    </button>
                </div>
                <div class="cuentasi">

                    <p>¿No tienes cuenta? <a href="registrar.html">registrarse</a></p>
                </div>
            </form>
        </div>





    </div>

</body>

</html>
